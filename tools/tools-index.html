<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atelier — Pavillon Noir</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap">
  <link rel="stylesheet" href="tools.css">
</head>

<body>
  <main class="tools-shell">
    <header class="tools-header">
      <div>
        <p class="tools-kicker">Pavillon Noir</p>
        <h1>Atelier</h1>
      </div>
      <a class="tools-return" href="../index.html">Campagne</a>
    </header>

    <section class="tools-grid" aria-label="Outils disponibles">
      <a class="tool-card tool-card--primary" href="zone-editor.html">
        <div class="tool-card-media" aria-hidden="true">
          <img src="assets/oceanbounds-mask.svg" alt="">
        </div>
        <div class="tool-card-body">
          <p class="tool-card-kicker">Cartographie</p>
          <h2>Zone Editor</h2>
          <p>Topographie, océanographie et contrôle des zones de navigation.</p>
        </div>
        <span class="tool-card-action">Ouvrir</span>
      </a>

      <a class="tool-card tool-card--primary tool-card--shipyard" href="chantier-naval.html">
        <div class="tool-card-mark" aria-hidden="true">CN</div>
        <div class="tool-card-body">
          <p class="tool-card-kicker">Navires</p>
          <h2>Chantier naval</h2>
          <p>Catalogue graphique pour créer, relire et équilibrer les fiches de navire.</p>
        </div>
        <span class="tool-card-action">Ouvrir</span>
      </a>
    </section>
  </main>
</body>

</html>
