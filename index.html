<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pavillon Noir — Campagne</title>
  <meta name="description" content="Site de campagne Pavillon Noir — Registre des personnages, aides de jeu et résumés de sessions.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏴‍☠️</text></svg>">
</head>
<body>

  <!-- Navigation -->
  <nav class="site-nav">
    <a class="nav-brand" href="index.html">Pavillon <span>Noir</span></a>
    <ul class="nav-links">
      <li><a href="index.html#registre" class="active">Registre</a></li>
      <li><a href="equipage.html">Équipage</a></li>
    </ul>
  </nav>

  <main>

    <!-- Hero -->
    <header class="hero">
      <div class="hero-content">
        <p class="hero-eyebrow">Caraïbes · 1713–17XX</p>
        <h1 class="hero-title">Pavillon <em>Noir</em></h1>
        <div class="hero-divider">
          <span class="hero-divider-icon">☠</span>
        </div>
        <p class="hero-subtitle">
          Registre des personnages rencontrés au fil de la campagne
        </p>
      </div>
    </header>

    <!-- Registre PNJ -->
    <section class="section" id="registre">
      <div class="section-header">
        <h2 class="section-title">Personnages</h2>
        <span class="section-count" id="pnj-count"></span>
      </div>

      <!-- Contrôles -->
      <div class="controls">
        <div class="search-wrapper">
          <span class="search-icon">⚲</span>
          <input
            type="search"
            id="search-input"
            class="search-input"
            placeholder="Rechercher un personnage, un lieu, un scénario…"
            autocomplete="off"
            spellcheck="false"
          >
        </div>
      </div>

      <div class="filter-tags" id="filter-tags"></div>
      <div style="height: 1.5rem;"></div>

      <!-- Grille -->
      <div class="pnj-container" id="pnj-grid"></div>
    </section>

  </main>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal" id="modal"></div>
  </div>

  <!-- Footer -->
  <footer>
    <p>Pavillon Noir &mdash; Campagne de jeu de rôle &mdash; Votre MJ est génial &mdash; ...et Claude m'a un peu aidé</p>
  </footer>

  <script src="js/pnj-data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/audio.js"></script>
  <script>audioInit('ost/registre.mp3');</script>

</body>
</html>
